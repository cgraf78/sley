name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@fb1777c6f248ece2ed02c8cb6d82533d011d3218
    with:
      matrix-set: full
      profiles: base,jq,python,zsh
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: SLEY_SKIP_SHELLCHECK=1 test/sley-test
